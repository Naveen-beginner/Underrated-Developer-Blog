[build]
  publish = "editors"

# Route protection & shortcuts
[[redirects]]
  from = "/"
  to = "/author_login.html"
  status = 302
  force = false

[[redirects]]
  from = "/login"
  to = "/author_login.html"
  status = 200

[[redirects]]
  from = "/editor"
  to = "/editor.html"
  status = 200

# Security headers: prevent public search indexing and clickjacking
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"
