<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="refresh" content="0; url=author_login.html">
    <title>Redirecting to Founder Studio...</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/authors-og-image.png">
    <link rel="shortcut icon" href="assets/favicon-16x16.ico">
    <style>
        body {
            background-color: #090d16;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .loader {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            border-top-color: #0284c7;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            font-size: 14px;
            color: #94a3b8;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
    <script>
        // Check if founder session exists, redirect to editor or login
        const token = localStorage.getItem('token') || localStorage.getItem('UD_FOUNDER_TOKEN');
        if (token) {
            window.location.replace("editor.html");
        } else {
            window.location.replace("author_login.html");
        }
    </script>
</head>

<body>
    <div>
        <div class="loader"></div>
        <p>Connecting to Underrated Studio... If you are not redirected, <a href="author_login.html">click here</a>.</p>
    </div>
</body>

</html>
