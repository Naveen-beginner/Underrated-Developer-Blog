<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor | UnderratedDev</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #080808;
            --surface: #101010;
            --surface-2: #0c0c0c;
            --border: #242424;
            --border-hover: #3a3a3a;
            --white: #fff;
            --text: #ddd;
            --muted: #777;
        }

        body {
            min-height: 100vh;
            background: var(--black);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* Header */

        header {
            height: 72px;
            padding: 0 5%;
            border-bottom: 1px solid #151515;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 10;

            background: rgba(8, 8, 8, 0.94);
            backdrop-filter: blur(12px);
        }

        .logo {
            color: var(--white);
            text-decoration: none;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .logo span {
            color: #666;
        }

        .editor-label {
            color: #555;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Main */

        main {
            width: min(1200px, 90%);
            margin: 0 auto;
            padding: 45px 0 100px;
        }

        .action-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 35px;
        }

        .action-toolbar button,
        .section-toolbar button,
        .block-toolbar button,
        .dyk-toolbar button {
            border: 1px solid var(--border);
            background: var(--surface);
            color: #aaa;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            transition: .2s ease;
        }

        .action-toolbar button:hover,
        .section-toolbar button:hover,
        .block-toolbar button:hover,
        .dyk-toolbar button:hover {
            border-color: var(--border-hover);
            color: var(--white);
            background: #151515;
        }

        .action-toolbar button:last-child {
            margin-left: auto;
            background: var(--white);
            color: #000;
            border-color: var(--white);
        }

        .action-toolbar button:last-child:hover {
            background: #ddd;
        }

        /* Blog layout */

        .blog-post-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 70px;
            align-items: start;
        }

        .left {
            min-width: 0;
        }

        .right {
            min-width: 0;
        }

        /* Editable elements */

        [contenteditable="true"] {
            outline: none;
            border: 1px solid transparent;
            transition: .2s ease;
        }

        [contenteditable="true"]:hover {
            border-color: #202020;
        }

        [contenteditable="true"]:focus {
            border-color: #3a3a3a;
            background: #0d0d0d;
        }

        /* Post heading */

        .blog-post-out-heading {
            color: var(--white);
            font-size: clamp(42px, 5vw, 70px);
            line-height: .98;
            letter-spacing: -3.5px;
            font-weight: 800;

            padding: 8px;
            margin: -8px 0 18px;
        }

        .blog-post-time-stamps {
            color: #555;
            font-size: 12px;
            margin-bottom: 28px;
        }

        .blog-post-time-stamps span {
            color: #888;
            padding: 4px;
        }

        .blog-short-description {
            color: #999;
            font-size: 16px;
            line-height: 1.7;

            padding: 8px;
            margin: -8px 0 50px;
        }

        /* Sections */

        .section {
            margin-bottom: 55px;
            padding-bottom: 35px;
            border-bottom: 1px solid #171717;
        }

        .section>h2 {
            color: var(--white);
            font-size: 28px;
            letter-spacing: -1px;
            margin-bottom: 22px;
            padding: 7px;
            margin-left: -7px;
        }

        .section-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .editor-block {
            margin-bottom: 8px;
        }

        .editor-block p,
        .editor-list {
            color: #aaa;
            font-size: 14px;
            line-height: 1.8;
        }

        .editor-block p {
            padding: 8px;
            margin-left: -8px;
        }

        .editor-list {
            padding: 8px 8px 8px 28px;
            margin-left: -8px;
        }

        .editor-list li {
            margin-bottom: 7px;
        }

        .editor-list li:last-child {
            margin-bottom: 0;
        }

        /* Toolbars */

        .section-toolbar,
        .block-toolbar,
        .dyk-toolbar {
            display: flex;
            gap: 6px;
        }

        .section-toolbar {
            margin-top: 20px;
        }

        .block-toolbar {
            margin: 7px 0 15px;
        }

        .block-toolbar button {
            min-width: 32px;
            padding: 6px 9px;
        }

        /* DYK */

        .right {
            position: sticky;
            top: 105px;
        }

        .right-card {
            margin-bottom: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 25px;
        }

        .out-heading {
            color: var(--white);
            font-size: 17px;
            letter-spacing: -.5px;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            color: #999;
            border: 1px solid var(--border);
            padding: 5px 8px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .fact-number {
            color: #444;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .content .title {
            color: var(--white);
            font-size: 18px;
            line-height: 1.3;
            margin-bottom: 10px;
            padding: 5px;
            margin-left: -5px;
        }

        .content .description {
            color: #888;
            font-size: 13px;
            line-height: 1.7;
            padding: 5px;
            margin-left: -5px;
        }

        .dyk-toolbar {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #1b1b1b;
        }

        /* Mobile */

        @media (max-width: 850px) {
            header {
                padding: 0 22px;
            }

            main {
                width: calc(100% - 44px);
                padding-top: 30px;
            }

            .blog-post-container {
                grid-template-columns: 1fr;
                gap: 50px;
            }

            .right {
                position: static;
            }

            .right-card {
                max-width: 500px;
            }
        }

        @media (max-width: 600px) {
            .editor-label {
                display: none;
            }

            .action-toolbar {
                flex-wrap: wrap;
            }

            .action-toolbar button:last-child {
                margin-left: 0;
            }

            .blog-post-out-heading {
                font-size: 45px;
                letter-spacing: -2.5px;
            }

            .blog-short-description {
                font-size: 14px;
                margin-bottom: 40px;
            }

            .section>h2 {
                font-size: 24px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="/" class="logo">
            UNDERRATED<span>.</span>
        </a>

        <div class="editor-label">
            Post Editor
        </div>
    </header>

    <main>

        <div class="action-toolbar">
            <button onclick="addSection()">+ Section</button>
            <button onclick="addDYK()">+ DYK</button>
            <button onclick="savePost()">Save</button>
        </div>

        <div class="blog-post-container">

            <div class="left">

                <h1 class="blog-post-out-heading" id="post-title" contenteditable="true">
                    BUILDING THE - ABANDONED IDE
                </h1>

                <div class="blog-post-time-stamps">
                    By
                    <span id="post-author" contenteditable="true">Santhosh</span>,
                    <span id="post-date" contenteditable="true">30th August 2026</span>
                </div>

                <div class="blog-short-description" id="short-description" contenteditable="true">
                    <p>A journey through building a lightweight Flutter-based IDE for Windows.</p>
                </div>

                <div class="main-content" id="main-content"></div>

            </div>

            <div class="right" id="dyk-container"></div>

        </div>

    </main>

    <script src="editor.js"></script>

</body>

</html>
