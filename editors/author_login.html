<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | UnderratedDev</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #080808;
            --card: #101010;
            --border: #242424;
            --white: #fff;
            --text: #ddd;
            --muted: #777;
        }

        body {
            min-height: 100vh;
            background: var(--black);
            color: var(--white);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 28px 5%;
        }

        .logo {
            color: var(--white);
            text-decoration: none;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .logo span {
            color: #666;
        }

        main {
            flex: 1;
            width: min(1050px, 90%);
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 80px;
            padding: 50px 0 90px;
        }

        .intro {
            max-width: 450px;
        }

        .eyebrow {
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .intro h1 {
            font-size: clamp(48px, 6vw, 78px);
            line-height: .95;
            letter-spacing: -4px;
            margin-bottom: 24px;
        }

        .intro h1 span {
            color: #555;
        }

        .intro p {
            max-width: 400px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            background: var(--card);
            border: 1px solid var(--border);
        }

        .login-card h2 {
            font-size: 26px;
            letter-spacing: -1px;
            margin-bottom: 7px;
        }

        .login-card>p {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            background: #0b0b0b;
            border: 1px solid var(--border);
            outline: none;
            color: var(--white);
            font-size: 14px;
        }

        input:focus {
            border-color: #555;
        }

        input::placeholder {
            color: #444;
        }

        .password-input {
            padding-right: 55px;
        }

        .toggle-password {
            position: absolute;
            right: 0;
            top: 0;
            width: 52px;
            height: 50px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 10px;
            cursor: pointer;
        }

        .toggle-password:hover {
            color: var(--white);
        }

        .login-button {
            width: 100%;
            height: 52px;
            border: none;
            background: var(--white);
            color: #000;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.3px;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #ddd;
        }

        .login-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            font-size: 12px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #ff6b6b;
        }

        .message.success {
            display: block;
            color: #8cff9b;
        }

        .register {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: #666;
            font-size: 12px;
        }

        .register a {
            color: var(--white);
            text-decoration: none;
            margin-left: 4px;
        }

        .register a:hover {
            text-decoration: underline;
        }

        footer {
            padding: 22px 5%;
            border-top: 1px solid #151515;
            color: #444;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 800px) {
            main {
                grid-template-columns: 1fr;
                gap: 45px;
                padding-top: 30px;
            }

            .intro {
                max-width: 600px;
            }

            .login-card {
                max-width: 600px;
            }
        }

        @media (max-width: 500px) {
            header {
                padding: 22px;
            }

            main {
                width: calc(100% - 44px);
                padding: 35px 0 60px;
            }

            .intro h1 {
                font-size: 50px;
                letter-spacing: -3px;
            }

            .login-card {
                padding: 28px 22px;
            }

            footer {
                padding: 18px 22px;
                flex-direction: column;
                gap: 7px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <header>
            <a href="/" class="logo">
                UNDERRATED<span>.</span>
            </a>
        </header>

        <main>

            <section class="intro">
                <div class="eyebrow">Developer Access</div>

                <h1>
                    Welcome<br>
                    <span>back.</span>
                </h1>

                <p>
                    Sign in to continue exploring, creating,
                    and sharing with the UnderratedDev community.
                </p>
            </section>

            <section class="login-card">

                <h2>Sign in</h2>

                <p>Enter your credentials to continue.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>

                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="input-wrapper">

                            <input type="password" id="password" class="password-input"
                                placeholder="Enter your password" autocomplete="current-password" required>

                            <button type="button" class="toggle-password" id="togglePassword">
                                SHOW
                            </button>

                        </div>
                    </div>

                    <button type="submit" class="login-button" id="loginButton">
                        SIGN IN →
                    </button>

                    <div class="message" id="message"></div>

                </form>

                <div class="register">
                    Don't have an account?
                    <a href="/register">Create one</a>
                </div>

            </section>

        </main>

        <footer>
            <span>© 2026 UnderratedDev</span>
            <span>For Developers, By Developers.</span>
        </footer>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        togglePassword.addEventListener("click", () => {
            const visible = passwordInput.type === "text";

            passwordInput.type = visible ? "password" : "text";
            togglePassword.textContent = visible ? "SHOW" : "HIDE";
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.className = "message";

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage(
                    "Please enter your email and password.",
                    "error"
                );
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "SIGNING IN...";

            try {
                const response = await fetch(
                    "http://localhost:5500/api/auth/my/iamtheadmin",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email,
                            password
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Login failed."
                    );
                }

                if (result.token) {
                    localStorage.setItem("token", result.token);
                }

                showMessage(
                    "Login successful.",
                    "success"
                );

                setTimeout(() => {
                    window.location.href = "editor.html";
                }, 700);

            } catch (error) {
                console.error("Login error:", error);

                showMessage(
                    error.message || "Something went wrong.",
                    "error"
                );
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "SIGN IN →";
            }
        });
    </script>

</body>

</html>
