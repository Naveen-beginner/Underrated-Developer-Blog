<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Engineering Archive | Underrated Developer</title>

    <meta name="description"
        content="Technical field notes, Flutter internals, Dart compilation, Play Store releases, and AI architectures by Naveen &amp; Santhosh Paul.">
    <meta name="author" content="Naveen, Santhosh Paul">

    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://underrateddeveloper.com/blog.html">

    <!-- Favicon (TUD Mark) -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/authors-og-image.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/authors-og-image.png">
    <link rel="shortcut icon" href="assets/favicons/favicon-16x16.ico">
    <link rel="apple-touch-icon" href="assets/favicons/authors-og-image.png">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Underrated Developer">
    <meta property="og:title" content="The Engineering Archive | Underrated Developer">
    <meta property="og:description" content="Technical field notes, Flutter internals, and Play Store releases.">
    <meta property="og:url" content="https://underrateddeveloper.com/blog.html">
    <meta property="og:image" content="https://underrateddeveloper.com/assets/favicons/official_logo_branding_transparent.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Theme Initialization (Prevents flash) -->
    <script>
        (function() {
            const saved = localStorage.getItem('ud-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/footer.css">

    <script type="module" src="components/navbar.js"></script>
    <script type="module" src="components/footer.js"></script>
</head>

<body>
    <app-navbar></app-navbar>

    <main>
        <section class="blog-page-hero">
            <div class="container">
                <span class="tag-pill blue" style="margin-bottom: 14px;">Articles & Deep Dives</span>
                <h1 style="font-size: clamp(32px, 4.5vw, 44px); font-weight: 800; color: var(--text-primary); letter-spacing: -1px; margin-bottom: 10px;">
                    The Engineering Archive
                </h1>
                <p style="font-size: 16px; color: var(--text-muted); max-width: 650px; line-height: 1.65;">
                    Uncompromised architectural writing, compiled Dart benchmarks, Google Play Store compliance guides, and autonomous AI agents.
                </p>

                <!-- Search Input -->
                <div class="clean-search-box">
                    <span class="material-symbols-outlined clean-search-icon">search</span>
                    <input type="text" id="search-input" class="clean-search-input" placeholder="Search by topic, Dart, Flutter, or keyword..." aria-label="Search articles">
                </div>

                <!-- Minimalist Category Filter Buttons -->
                <div class="filter-bar-clean" role="tablist">
                    <button class="filter-btn-clean active" data-tag="All" role="tab" aria-selected="true">All</button>
                    <button class="filter-btn-clean" data-tag="Flutter & Dart" role="tab" aria-selected="false">Flutter & Dart</button>
                    <button class="filter-btn-clean" data-tag="App Publishing" role="tab" aria-selected="false">App Publishing</button>
                    <button class="filter-btn-clean" data-tag="AI & Agents" role="tab" aria-selected="false">AI & Agents</button>
                    <button class="filter-btn-clean" data-tag="Web Tech" role="tab" aria-selected="false">Web Tech</button>
                </div>

                <div style="margin-top: 18px; font-size: 13px; color: var(--text-dim);">
                    <span id="posts-count-label">Loading archive...</span>
                </div>
            </div>
        </section>

        <!-- Archive Feed Section -->
        <section class="journal-section">
            <div class="container">
                <div class="journal-feed" id="posts-container">
                    <!-- Populated dynamically via blog.js -->
                </div>
            </div>
        </section>
    </main>

    <app-footer></app-footer>

    <script type="module" src="js/blog.js"></script>
</body>

</html>
