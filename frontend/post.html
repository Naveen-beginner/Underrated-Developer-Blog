<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flutter for Windows: My First Experience Building a Desktop App</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/authors-og-image.png">

    <!-- Importing Google material Icons (OUTLINED) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <!-- Font awesome icons cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Importing stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/post.css">
    <link rel="stylesheet" href="css/footer.css">

    <!-- Importing HTML components -->
    <script type="module" src="js/app.js"></script>

</head>

<body>

    <app-navbar></app-navbar>

    <main>

        <div class="blog-post-container">

            <div class="left">

                <h1 class="blog-post-out-heading" id="post-title"></h1>

                <div class="blog-post-time-stamps">
                    By <span id="post-author"></span>,
                    <span id="post-date"></span>
                </div>

                <div class="blog-short-description" id="short-description">
                    <p></p>
                </div>

                <div class="main-content" id="main-content"></div>

            </div>

            <div class="right" id="dyk-container"></div>

        </div>

    </main>

    <app-footer></app-footer>
</body>

<!-- Access post details -->
<script type="module" src="js/post.js" defer></script>

</html>
